  <body>
    <header class="top" id="top">
      <a class="home" href="/" aria-label="Bredbord home page"
        ><svg class="logo" id="logo" role="img" aria-label="Bredbord"></svg
      ></a>
      <span class="grow"></span>
      <a class="btn sim after-acct" href="/app/">Open the simulator</a>
    </header>
    <main class="page wide">
      <h1 class="pxh"><svg data-px="Community" role="img" aria-label="Community"></svg></h1>
      <div class="tools">
        <input
          class="inp"
          id="q"
          type="search"
          placeholder="Search circuits"
          aria-label="Search circuits"
          autocomplete="off"
        />
        <select class="sel" id="sort" aria-label="Sort">
          <option value="popular">Popular</option>
          <option value="new">New</option>
          <option value="remixed">Most remixed</option>
        </select>
        <div class="mw">
          <button
            class="sel tagb"
            id="tags-b"
            type="button"
            data-menu="tags"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span class="v">All tags</span><span class="ic sm" data-ic="chev"></span>
          </button>
          <div class="menu right" id="menu-tags" role="menu"></div>
        </div>
      </div>
      <div class="cgrid" id="grid"></div>
      <p class="cempty" id="empty" hidden></p>
      <div class="more-row"><button class="btn" id="more" type="button" hidden>Show more</button></div>
    </main>
    <script type="module" src="/src/site/community-page.ts"></script>
  </body>
