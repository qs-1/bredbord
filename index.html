    <style>
      /*
 * The landing page: one breadboard, live in 3D (src/landing/landing.ts). It starts upside down, the logo
 * standing in a panel on its back; scrolling turns it over, exactly as far as you've scrolled.
 */
      :root {
        --ink: #1f1d1a;
        --ink-2: #57524a;
        --page: #b9b3a7;
        --line: rgba(31, 29, 26, 0.18);
        --font: 'Atkinson Hyperlegible Next', system-ui, sans-serif;
        --font-label: 'Barlow Semi Condensed', sans-serif;
        --font-mono: 'Sometype Mono', monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--page);
      }
      body {
        margin: 0;
        color: var(--ink);
        font: 400 15px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      .top {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 5;
        padding: 18px 24px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .top .gh {
        display: flex;
        text-decoration: none;
      }
      .top .gh svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .top a {
        color: var(--ink-2);
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-color: var(--line);
        transition:
          color 0.15s var(--ease),
          text-decoration-color 0.15s var(--ease);
      }
      .top a:hover {
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
      .flip {
        height: 260vh;
        position: relative;
      }
      .stage {
        position: sticky;
        top: 0;
        height: 100vh;
        /* On a phone, the screen less the browser's bars at their biggest: it doesn't jump as they hide. */
        height: 100svh;
      }
      #board {
        display: block;
        /* Upright swipes scroll the page; sideways ones turn the knob. No flash or menu on a tap. */
        touch-action: pan-y;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        width: 100%;
        height: 100%;
        opacity: 0;
        transform: translateY(10px) scale(0.985);
        transition:
          opacity 0.7s var(--ease) 0.08s,
          transform 0.9s var(--ease) 0.08s;
      }
      .ready #board {
        opacity: 1;
        transform: none;
      }
      /* Under the board once it's face up; on a tall screen, along the bottom in the room kept for it. */
      .try {
        position: absolute;
        left: 50%;
        bottom: 11%;
        translate: -50% 8px;
        display: block;
        opacity: 0;
        pointer-events: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          opacity 0.35s var(--ease),
          translate 0.45s var(--ease);
      }
      /* Drawn by src/landing/try.ts; its room for the sparks hangs outside the link. */
      .try canvas {
        display: block;
        pointer-events: none;
      }
      /* A little more to point at, or tap, than the pixels themselves. */
      .try::after {
        content: '';
        position: absolute;
        inset: -12px -16px;
      }
      .try:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 10px;
        border-radius: 2px;
      }
      .landed .try {
        opacity: 1;
        translate: -50% 0;
        pointer-events: auto;
      }
      @media (orientation: portrait) {
        .try {
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
        }
      }
      /* On a phone, before the first scroll: three pixels lighting up one after another, downwards, where
         the Try it button will be. */
      .scroll-hint {
        display: none;
      }
      @media (pointer: coarse) {
        .scroll-hint {
          position: absolute;
          left: 50%;
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
          translate: -50% 0;
          display: grid;
          gap: 4px;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.4s var(--ease);
        }
        .ready .scroll-hint {
          opacity: 1;
          transition-delay: 1.2s;
        }
        .turning .scroll-hint {
          opacity: 0;
          transition-delay: 0s;
        }
        .scroll-hint i {
          width: 4px;
          height: 4px;
          background: var(--ink-2);
          opacity: 0.18;
          animation: hint 1.5s steps(1) infinite;
        }
        .scroll-hint i:nth-child(2) {
          animation-delay: 0.25s;
        }
        .scroll-hint i:nth-child(3) {
          animation-delay: 0.5s;
        }
      }
      @keyframes hint {
        0% {
          opacity: 0.85;
        }
        17% {
          opacity: 0.18;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scroll-hint i {
          animation: none;
          opacity: 0.5;
        }
      }
      /* The loader: sparks running along the logo's two rails while the board gets ready. It waits a moment
   before showing, so a quick load never flashes it, and fades out as the board fades in. */
      #loader {
        position: fixed;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        pointer-events: none;
        opacity: 0;
        animation: loader-in 0.3s var(--ease) 0.12s forwards;
        transition:
          opacity 0.35s var(--ease),
          scale 0.35s var(--ease);
      }
      #loader.done {
        opacity: 0 !important;
        scale: 0.96;
        animation: none;
      }
      @keyframes loader-in {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flip {
          height: 100vh;
        }
        #board {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="loader" aria-hidden="true"></canvas>
    <script>
      (() => {
        // Sparks running along the logo's two rails: a spark runs along the red rail one way and the blue
        // the other, throwing off pixel sparks that fall away. Drawn in a worker where the browser allows,
        // so it keeps running while the page is busy building the board.
        function run(c, K) {
          const g = c.getContext('2d');
          const RED = '#e2362a',
            BLUE = '#2a62d8',
            HOT = ['#ffd84a', '#ffad1f', '#f2761a', '#d9531a'];
          const VB = [-6, -8, 57, 26];
          const raf = self.requestAnimationFrame
            ? (f) => self.requestAnimationFrame(f)
            : (f) => setTimeout(() => f(performance.now()), 16);
          const rnd = (a, b) => a + Math.random() * (b - a);
          const px = (x, y, color, o) => {
            if (o <= 0) return;
            g.globalAlpha = Math.min(1, o);
            g.fillStyle = color;
            g.fillRect((x - VB[0]) * K, (y - VB[1]) * K, K, K);
          };
          let ps = [],
            last = performance.now();
          const t0 = last;
          const frame = (now) => {
            const dt = Math.min(0.05, (now - last) / 1000),
              T = (now - t0) / 1000;
            last = now;
            g.clearRect(0, 0, c.width, c.height);
            g.globalAlpha = 1;
            g.fillStyle = RED;
            g.fillRect(-VB[0] * K, -VB[1] * K, 45 * K, K);
            g.fillStyle = BLUE;
            g.fillRect(-VB[0] * K, (10 - VB[1]) * K, 45 * K, K);
            const P = 1.8,
              p = (T % P) / P;
            for (const [hx, hy, dir] of [
              [-3 + p * 51, 0, 1],
              [47 - p * 51, 10, -1],
            ]) {
              const x = Math.round(hx);
              for (let k = 0; k < 4; k++) {
                const tx = x - dir * k;
                if (tx >= 0 && tx < 45) px(tx, hy, HOT[k], k ? 1 - k * 0.22 : 1);
              }
              if (x >= 0 && x < 45 && Math.random() < dt * 20)
                ps.push({
                  x,
                  y: hy,
                  vx: -dir * rnd(3, 9),
                  vy: hy === 0 ? rnd(-11, -4) : rnd(-5, 1),
                  age: 0,
                  life: rnd(0.35, 0.6),
                });
            }
            for (const q of ps) {
              q.age += dt;
              q.vy += 32 * dt;
              q.x += q.vx * dt;
              q.y += q.vy * dt;
            }
            ps = ps.filter((q) => q.age < q.life);
            for (const q of ps) {
              const k = q.age / q.life;
              px(
                Math.round(q.x),
                Math.round(q.y),
                HOT[Math.min(3, 1 + Math.floor(k * 3))],
                k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4,
              );
            }
            if (!self.stopped) raf(frame);
          };
          raf(frame);
        }

        const c = document.getElementById('loader');
        // Whole screen pixels per art pixel, so the pixels stay crisp at any zoom.
        const d = devicePixelRatio || 1,
          K = Math.max(1, Math.round(4 * d));
        c.width = 57 * K;
        c.height = 26 * K;
        c.style.width = c.width / d + 'px';
        c.style.height = c.height / d + 'px';
        let worker = null;
        if (c.transferControlToOffscreen && window.Worker) {
          const off = c.transferControlToOffscreen();
          worker = new Worker(
            URL.createObjectURL(
              new Blob([
                `const run = ${run};
onmessage = (e) => run(e.data.c, e.data.K);`,
              ]),
            ),
          );
          worker.postMessage({ c: off, K }, [off]);
        } else run(c, K);
        const t0 = performance.now();
        const end = () => {
          if (worker) worker.terminate();
          else self.stopped = true;
          c.remove();
        };
        // Called once the board is ready. A load quick enough that the loader never showed skips it; once
        // it has shown, it stays long enough to read as meant, then fades as the board comes in.
        window.loader = {
          finish() {
            const shown = performance.now() - t0 - 120;
            if (shown <= 0) {
              end();
              return Promise.resolve();
            }
            return new Promise((done) =>
              setTimeout(
                () => {
                  c.classList.add('done');
                  setTimeout(end, 400);
                  done();
                },
                Math.max(0, 650 - shown),
              ),
            );
          },
        };
      })();
    </script>
